name: Build & Verify Windows App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build & Test Windows App
    runs-on: windows-latest

    env:
      BUILD_CONFIG: ${{ inputs.configuration || 'Release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: dotnet restore MangaDl.sln

      - name: Run Core Tests (105 Test Cases)
        run: dotnet test test/MangaDl.Core.Tests/MangaDl.Core.Tests.csproj -c ${{ env.BUILD_CONFIG }} --logger "trx;LogFileName=test-results.trx"

      - name: Build Solution (${{ env.BUILD_CONFIG }} x64)
        run: msbuild MangaDl.sln /p:Configuration=${{ env.BUILD_CONFIG }} /p:Platform=x64 /verbosity:minimal

      - name: Publish Self-Contained Windows App
        shell: pwsh
        run: |
          dotnet publish src/MangaDl.App/MangaDl.App.csproj -c ${{ env.BUILD_CONFIG }} -r win-x64 --self-contained true -o ./publish /p:Platform=x64
          if (Test-Path "x64/${{ env.BUILD_CONFIG }}/MangaDl.Native.dll") {
            Copy-Item "x64/${{ env.BUILD_CONFIG }}/MangaDl.Native.dll" -Destination "./publish/"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile Windows Setup Installer (.exe)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc -or -not (Test-Path $iscc)) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer/manga-dl.iss

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Results
          path: test/MangaDl.Core.Tests/TestResults/test-results.trx
          if-no-files-found: ignore

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: MangaDl-Setup-x64
          path: installer_output/MangaDl-Setup-x64.exe
          if-no-files-found: error

      - name: Upload Portable Windows App (Self-Contained)
        uses: actions/upload-artifact@v4
        with:
          name: MangaDl-Windows-x64-Portable
          path: ./publish/
          if-no-files-found: warn
